<!doctype html>
<html lang="pt">
    <head><meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <title>MiniGestão G3</title>
        <style>body{font-family:Arial,sans-serif;background:#f3f6fa;color:#15253a;margin:0}.wrap{max-width:820px;margin:35px auto;padding:20px}
        header{background:#18365a;color:white;padding:20px;border-radius:10px}
        section{background:white;margin-top:18px;padding:20px;border-radius:10px;box-shadow:0 1px 4px #ccc}
        label{display:block;margin-top:10px}input,button{padding:10px;margin:5px 5px 5px 0;border-radius:5px;border:1px solid #9daab9}
        button{background:#1467ae;color:white;cursor:pointer}
        li{padding:5px}.msg{font-weight:bold;color:#164b76}</style></head><body><div class="wrap">
            <header><h1>MiniGestão — Laboratório G3</h1><p>Aplicação didáctica para testes funcionais automatizados</p></header>
            <section><label><input type="checkbox" id="defeitos"/> Activar modo com defeitos intencionais</label><p>Modo: <strong id="modo">Correcto</strong></p></section>
            <section><h2>Autenticação</h2><label for="email">Email</label><input id="email" type="email" placeholder="Email"/><label for="senha">Senha</label><input id="senha" type="password" placeholder="Senha"/><button id="entrar">Entrar</button><p id="loginMsg" class="msg" role="status"></p></section>
            <section><h2>Cadastro de vendedor</h2><label for="nome">Nome</label><input id="nome" placeholder="Nome do vendedor"/><label for="mercado">Mercado</label><input id="mercado" placeholder="Mercado"/><button id="guardar">Guardar vendedor</button><p id="cadMsg" class="msg" role="status"></p><ul id="lista"></ul></section><section><h2>Pesquisa de produtos</h2><label for="busca">Pesquisar</label><input id="busca" placeholder="Produto"/><button id="pesquisar">Pesquisar</button><ul id="produtos"></ul></section></div><script type="module" src="/app/main.js"></script></body></html>
